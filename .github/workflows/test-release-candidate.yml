name: Test or publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-ui-tests:
    name: macOS UI regression tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run the checked-in Xcode UI test host
        run: >-
          xcodebuild -project Kistulentz.xcodeproj -scheme Kistulentz
          -destination 'platform=macOS'
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 45
          -maximum-test-execution-time-allowance 60
          test

  intel-ui-smoke:
    name: Intel UI exit-path smoke tests
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Verify critical workspaces remain usable on Intel
        run: >-
          xcodebuild -project Kistulentz.xcodeproj -scheme Kistulentz
          -destination 'platform=macOS'
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 45
          -maximum-test-execution-time-allowance 60
          -only-testing:KistulentzUITests/KistulentzUITests/testMajorProjectWorkspacesKeepTheirExitControlsUsableAtTheMinimumWindowSize
          -only-testing:KistulentzUITests/KistulentzUITests/testReferenceLibraryWelcomeAlwaysOffersACancelPath
          test

  native-tests:
    name: Native tests · ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Run tests on native hardware
        run: swift test --disable-sandbox
      - name: Build native release executable
        run: swift build --configuration release --arch "${{ matrix.architecture }}" --disable-sandbox

  universal-package:
    name: Universal package and integrity checks
    needs: [native-tests, macos-ui-tests, intel-ui-smoke]
    runs-on: macos-15
    # Signing and notarization credentials live only in the protected "release" environment, so a
    # branch workflow can never read them. Without them this job ships the ad-hoc-signed release it
    # always has.
    environment: release
    env:
      # Public: it is embedded in every signed build. Used to pin the signing team, not to sign.
      KISTULENTZ_EXPECTED_TEAM_ID: 8K5724Q6WR
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate the release tag and metadata
        if: github.event_name == 'push'
        run: |
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' must be an annotated tag." >&2
            exit 1
          fi

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match application version '$expected_tag'." >&2
            exit 1
          fi

          release_notes="DistributionAssets/RELEASE NOTES - Kistulentz ${version}.md"
          if [[ ! -f "$release_notes" ]]; then
            echo "Release notes are missing at '$release_notes'." >&2
            exit 1
          fi
      - name: Import the Developer ID certificate and notarization key
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$APPLE_API_KEY_P8" \
                || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER_ID" ]]; then
            echo "No complete set of signing credentials is configured; this release will be ad-hoc signed."
            exit 0
          fi

          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null

          # Put the temporary keychain first in the search list without dropping the existing ones.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" $existing

          identity="$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/^[^"]*"([^"]+)".*/\1/')"
          if [[ -z "$identity" ]]; then
            echo "The certificate does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          if [[ "$identity" != *"($KISTULENTZ_EXPECTED_TEAM_ID)"* ]]; then
            echo "The signing identity does not belong to team $KISTULENTZ_EXPECTED_TEAM_ID." >&2
            exit 1
          fi

          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"
          {
            echo "KISTULENTZ_SIGN_IDENTITY=$identity"
            echo "KISTULENTZ_NOTARIZE=1"
            echo "KISTULENTZ_REQUIRE_DEVELOPER_ID=1"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "Signing with: $identity"
      - name: Build ZIP, DMG, and checksums
        run: ./scripts/package-release.sh
      - name: Read packaged version
        id: packaged-version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)" >> "$GITHUB_OUTPUT"
      - name: Verify universal app and release assets
        run: ./scripts/verify-release.sh dist/Kistulentz.app --release-assets
      - name: Remove the signing keychain and notarization key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/certificate.p12"
      - name: Attest release build provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/releases/*.zip
            dist/releases/*.dmg
            dist/releases/*.spdx.json
            dist/releases/SHA256SUMS.txt
      - name: Attest the release SBOM
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/releases/*.zip
            dist/releases/*.dmg
          sbom-path: dist/releases/Kistulentz-${{ steps.packaged-version.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: Kistulentz-release-candidate
          path: |
            dist/releases/*.zip
            dist/releases/*.dmg
            dist/releases/*.spdx.json
            dist/releases/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: universal-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Kistulentz-release-candidate
          path: dist/releases
      - name: Create the versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_notes="DistributionAssets/RELEASE NOTES - Kistulentz ${version}.md"
          gh release create "$GITHUB_REF_NAME" \
            dist/releases/*.zip \
            dist/releases/*.dmg \
            dist/releases/*.spdx.json \
            dist/releases/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Kistulentz ${version}" \
            --notes-file "$release_notes"
