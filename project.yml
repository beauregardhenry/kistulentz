name: Kistulentz

options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Kistulentz:
    type: application
    platform: macOS
    sources:
      - path: AppSources/Kistulentz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauhenry.kistulentz
        PRODUCT_NAME: Kistulentz
        INFOPLIST_FILE: scripts/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: AppKit.framework
      - sdk: NaturalLanguage.framework
      - sdk: PDFKit.framework
      - sdk: Security.framework
      - sdk: Vision.framework

  KistulentzUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/KistulentzUITests
    dependencies:
      - target: Kistulentz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauhenry.kistulentz.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kistulentz

schemes:
  Kistulentz:
    build:
      targets:
        Kistulentz: all
        KistulentzUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: KistulentzUITests
      environmentVariables:
        KISTULENTZ_UI_TESTING: "1"
