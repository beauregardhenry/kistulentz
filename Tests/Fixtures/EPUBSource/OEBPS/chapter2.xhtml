    <h1>The River Road</h1>
    <p>The river ran black beside Elara. Wind pressed against the reeds, and the distant bells marked the hour.</p>
    <p>“You came alone,” Mara said from beneath the bridge.</p>
    <p>“Tomas had no choice.” Elara raised the lantern. Mara watched its small flame and stepped into the light.</p>
